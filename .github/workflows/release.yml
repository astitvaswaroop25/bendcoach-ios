name: Release

# Builds BendCoach for the App Store and uploads it to App Store Connect (TestFlight).
# Run it from the Actions tab: Release > Run workflow. Setup: docs/APP_STORE.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    name: Upload to App Store Connect
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Archive, sign and upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: tools/release_upload.sh
