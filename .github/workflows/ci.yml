name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bendkit-tests:
    name: BendKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Run the math library tests
        run: swift test --package-path Packages/BendKit

  math-crosscheck:
    name: Math cross-check (Python reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formulas against manufacturer examples
        run: python3 tools/crosscheck.py

  ios-build:
    name: iOS app build (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for the iOS Simulator
        run: |
          xcodebuild build \
            -project BendCoach.xcodeproj \
            -scheme BendCoach \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

  # Publishes an unsigned .ipa to the "test-build" release for sideloading onto a personal iPhone.
  test-ipa:
    name: Sideload test build (.ipa)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ios-build
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build an unsigned device app
        run: bash tools/build_test_ipa.sh
      - name: Publish to the test-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build build/BendCoach.ipa \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Test build (sideload)" \
            --notes "Unsigned Debug build of ${GITHUB_SHA::7} for installing with Sideloadly or AltStore. In the app, Settings → Developer → Unlock Pro turns on the Pro features for testing."

  # Runs only when the commit message contains [screenshots], to save macOS minutes.
  screenshots:
    name: Simulator screenshots
    if: contains(github.event.head_commit.message, '[screenshots]')
    needs: ios-build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run the app in demo mode and take screenshots
        run: bash tools/ci_screenshots.sh
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
